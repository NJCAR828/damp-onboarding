:root {

  --accent: #E04162; --accent-light: #fdf0f3; --accent-border: #f5b8c4;
  --blue: #90B4BA; --blue-light: #f0f6f7; --blue-border: #c5dde0;
  --green: #16a34a; --green-light: #f0fdf4; --green-border: #bbf7d0;
  --amber: #d97706; --amber-light: #fffbeb; --amber-border: #fde68a;
  --red: #dc2626; --red-light: #fef2f2; --red-border: #fecaca;
  --mono: 'JetBrains Mono', monospace; --sans: 'Inter', sans-serif;
  --radius: 8px; --radius-lg: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111318; --surface: #1c1f27; --border: #2a2e3a;
    --text: #e8eaf0; --text-secondary: #9099b0; --text-muted: #5a6070;
    --accent: #E04162; --accent-light: #2a1019; --accent-border: #6b1d2d;
    --blue: #90B4BA; --blue-light: #0d1f22; --blue-border: #2a4d52;
    --green: #22c55e; --green-light: #0d2018; --green-border: #14532d;
    --amber: #fbbf24; --amber-light: #1c1500; --amber-border: #78350f;
    --red: #f87171; --red-light: #1c0a0a; --red-border: #7f1d1d;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--sans); background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.6; padding-bottom: 80px; }
.site-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 32px; display: flex; align-items: center; justify-content: space-between; height: 72px; position: sticky; top: 0; z-index: 100; }
.logo { font-family: var(--mono); font-size: 14px; font-weight: 500; color: var(--accent); letter-spacing: 0.04em; }
.semester-badge { font-size: 12px; color: var(--text-muted); background: var(--bg); border: 1px solid var(--border); padding: 4px 10px; border-radius: 20px; font-family: var(--mono); }
.layout { display: grid; grid-template-columns: 220px 1fr; max-width: 1100px; margin: 0 auto; padding: 32px 24px 0; gap: 32px; align-items: start; }
@media (max-width: 700px) { .layout { grid-template-columns: 1fr; } .sidebar { display: none; } }
.sidebar { position: sticky; top: 88px; }
.sidebar-nav { list-style: none; display: flex; flex-direction: column; gap: 2px; }
.sidebar-nav a { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 6px; color: var(--text-secondary); text-decoration: none; font-size: 13px; font-weight: 500; transition: background 0.15s; cursor: pointer; }
.sidebar-nav a:hover { background: var(--border); color: var(--text); }
.sidebar-nav a.active { background: var(--accent-light); color: var(--accent); }
.sidebar-section { font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.08em; text-transform: uppercase; padding: 16px 10px 6px; }
.main { min-width: 0; }
.page-title { font-size: 26px; font-weight: 600; margin-bottom: 6px; line-height: 1.25; }
.page-sub { color: var(--text-secondary); font-size: 14px; margin-bottom: 32px; }
.section { margin-bottom: 40px; scroll-margin-top: 80px; }
.section-title { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px 24px; margin-bottom: 12px; }
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
.card-body { color: var(--text-secondary); font-size: 14px; line-height: 1.7; }
.card.accent-bar { border-left: 3px solid var(--accent); }
.card.blue-bar { border-left: 3px solid var(--blue); }
.info-block { border-left: 3px solid var(--blue); background: var(--blue-light); padding: 12px 16px; border-radius: 0 8px 8px 0; margin-bottom: 14px; }
.info-block p { font-size: 13px; color: var(--text-secondary); }
.info-block strong { color: var(--text); }
.warn-block { border-left: 3px solid var(--accent); background: var(--accent-light); padding: 12px 16px; border-radius: 0 8px 8px 0; margin-bottom: 14px; }
.warn-block p { font-size: 13px; color: var(--text-secondary); }
.progress-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 18px 22px; margin-bottom: 24px; display: flex; align-items: center; gap: 16px; }
.progress-bar-bg { flex: 1; height: 6px; background: var(--border); border-radius: 10px; overflow: hidden; }
.progress-bar-fill { height: 100%; background: var(--accent); border-radius: 10px; transition: width 0.4s ease; }
.progress-label { font-family: var(--mono); font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.task-list { display: flex; flex-direction: column; gap: 6px; }
.task-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; display: flex; align-items: center; gap: 12px; }
.task-item.done { background: var(--green-light); border-color: var(--green-border); }
.task-item.nodot { opacity: 0.7; }
.task-check { width: 16px; height: 16px; border: 2px solid var(--border); border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; }
.task-item.done .task-check { background: var(--green); border-color: var(--green); }
.task-check svg { display: none; }
.task-item.done .task-check svg { display: block; }
.task-num { font-family: var(--mono); font-size: 10px; color: var(--text-muted); flex-shrink: 0; }
.task-name { font-size: 13px; font-weight: 500; flex: 1; }
.task-item.done .task-name { color: var(--green); }

.section-complete { display: flex; align-items: center; justify-content: flex-end; margin-top: 12px; gap: 10px; }
.section-complete-btn { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text-secondary); font-family: var(--sans); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
.section-complete-btn:hover { border-color: var(--accent-border); color: var(--accent); }
.section-complete-btn.done { background: var(--green-light); border-color: var(--green-border); color: var(--green); cursor: default; }
.section-complete-btn .btn-check { width: 16px; height: 16px; border: 2px solid currentColor; border-radius: 4px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.section-complete-btn.done .btn-check { background: var(--green); border-color: var(--green); }
.btn { font-family: var(--sans); font-size: 12px; font-weight: 500; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary); cursor: pointer; transition: all 0.15s; }
.btn:hover { border-color: var(--accent-border); color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { opacity: 0.88; }
.btn.secondary { background: var(--blue); color: #fff; border-color: var(--blue); }
.btn.secondary:hover { opacity: 0.88; }
.btn.success { background: var(--green); color: #fff; border-color: var(--green); }
.btn.danger { background: var(--red-light); color: var(--red); border-color: var(--red-border); }
.skill-tag { display: inline-block; font-size: 11px; font-family: var(--mono); padding: 2px 8px; border-radius: 20px; background: var(--blue-light); color: var(--blue); border: 1px solid var(--blue-border); margin: 2px; }
.tracker-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 24px; }
.tracker-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px; }
.tracker-title { font-size: 14px; font-weight: 600; }
.tracker-table { width: 100%; border-collapse: collapse; }
.tracker-table th { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); background: var(--bg); }
.tracker-table td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
.tracker-table tr:last-child td { border-bottom: none; }
.tracker-table tbody tr:hover { background: var(--bg); }
.member-name { font-weight: 500; }
.member-meta { font-size: 11px; color: var(--text-muted); font-family: var(--mono); }
.dot { width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; }
.dot.done { background: var(--green-light); color: var(--green); border: 1.5px solid var(--green-border); }
.dot.pending-dot { background: var(--bg); border: 1.5px solid var(--border); }
.tasks-dots { display: flex; gap: 4px; }
.status-pill { font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 20px; display: inline-block; }
.status-pill.complete { background: var(--green-light); color: var(--green); }
.status-pill.inprogress { background: var(--blue-light); color: var(--blue); }
.status-pill.notstarted { background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); }
.form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px; max-width: 620px; }
.form-group { margin-bottom: 18px; }
.form-label { font-size: 13px; font-weight: 500; margin-bottom: 6px; display: block; }
.form-label span { color: var(--text-muted); font-weight: 400; }
.form-input, .form-select, .form-textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; outline: none; transition: border-color 0.15s; }
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
.form-textarea { resize: vertical; min-height: 80px; }
.form-row { display: flex; gap: 12px; }
.form-row .form-group { flex: 1; }
.form-error { font-size: 12px; color: var(--red); margin-top: 4px; display: none; }
.form-error.show { display: block; }
.form-input-inline { padding: 4px 8px; font-size: 12px; width: 130px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-family: var(--sans); outline: none; }
.success-state { text-align: center; padding: 60px 32px; }
.success-icon { width: 56px; height: 56px; background: var(--green-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; border: 2px solid var(--green-border); }
.success-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
.success-sub { color: var(--text-secondary); font-size: 14px; }
.gate { max-width: 540px; margin: 60px auto; text-align: center; padding: 0 24px; }
.gate-emoji { font-size: 40px; margin-bottom: 20px; }
.gate-title { font-size: 22px; font-weight: 600; margin-bottom: 10px; }
.gate-sub { color: var(--text-secondary); font-size: 14px; margin-bottom: 28px; line-height: 1.7; }
.loading { color: var(--text-muted); font-size: 13px; padding: 32px; text-align: center; }
/* Expandable rows */
.expand-btn { background: none; border: none; cursor: pointer; font-size: 11px; color: var(--text-muted); font-family: var(--mono); padding: 2px 6px; border-radius: 4px; transition: all 0.15s; }
.expand-btn:hover { background: var(--border); color: var(--text); }
.detail-row { display: none; }
.detail-row.open { display: table-row; }
.detail-panel { background: var(--bg); padding: 16px 20px; border-top: 1px solid var(--border); }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; }
.detail-field { }
.detail-label { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 3px; }
.detail-value { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }

/* Project interest cards */
.project-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px 24px; margin-bottom: 12px; }
.project-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 10px; }
.project-card-title { font-size: 15px; font-weight: 600; }
.project-card-body { color: var(--text-secondary); font-size: 14px; line-height: 1.7; margin-bottom: 16px; }
.project-links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
.project-link-btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 7px; font-size: 12px; font-weight: 500; text-decoration: none; border: 1.5px solid var(--border); color: var(--text-secondary); background: var(--bg); transition: all 0.15s; cursor: pointer; font-family: var(--sans); }
.project-link-btn:hover { border-color: var(--accent-border); color: var(--accent); }
.project-link-btn.join { background: var(--accent); color: #fff; border-color: var(--accent); }
.project-link-btn.join:hover { opacity: 0.88; }

/* Modal */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px; width: 620px; max-width: 95vw; }
.modal-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
.modal-sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; }
.modal-actions { display: flex; gap: 8px; margin-top: 20px; }
</style>

async function init() {
  if (sessionRole === 'lead') { renderLeadView(); return; }
  if (sessionEmail) {
    const found = await findMemberByEmail(sessionEmail);
    if (found) {
      myRecord = found;
      if (found.status === 'approved') { myTasks = found.tasks || {}; renderOnboarding(); }
      else renderPendingGate();
      return;
    }
  }
  renderInterestForm();
}

async function findMemberByEmail(email) {
  const q = query(collection(db,'members'), where('email','==',email));
  const snap = await getDocs(q);
  if (snap.empty) return null;
  return { id: snap.docs[0].id, ...snap.docs[0].data() };
}

window.lookupEmail = async function() {
  const email = document.getElementById('lookup-email').value.trim();
  if (!email || !email.includes('@')) return;
  const found = await findMemberByEmail(email);
  if (!found) { document.getElementById('lookup-err').classList.add('show'); return; }
  localStorage.setItem('damp_email', email);
  sessionEmail = email; myRecord = found;
  if (found.status === 'approved') { myTasks = found.tasks || {}; renderOnboarding(); }
  else renderPendingGate();
};

window.submitForm = async function() {
  const first = document.getElementById('f-first').value.trim();
  const last = document.getElementById('f-last').value.trim();
  const email = document.getElementById('f-email').value.trim();
  const year = document.getElementById('f-year').value;
  const major = document.getElementById('f-major').value.trim();
  const returning = document.querySelector('input[name="returning"]:checked')?.value || '';
  const areas = [...document.querySelectorAll('input[type="checkbox"][value]')].filter(c=>['Robotics','Protocols','Choreography','Interface'].includes(c.value)&&c.checked).map(c=>c.value);
  const wetlab = document.getElementById('f-wetlab').value.trim();
  const hardware = document.getElementById('f-hardware').value.trim();
  const software = document.getElementById('f-software').value.trim();
  let valid = true;
  const chk = (errId,cond,msg) => { const el=document.getElementById(errId); if(!cond){if(msg)el.textContent=msg;el.classList.add('show');valid=false;}else el.classList.remove('show'); };
  chk('e-first',first); chk('e-last',last); chk('e-email',email&&email.includes('@')); chk('e-year',year); chk('e-major',major);
  chk('e-returning',returning); chk('e-areas',areas.length>0); chk('e-wetlab',wetlab); chk('e-hardware',hardware); chk('e-software',software);
  if (!valid) return;
  const existing = await findMemberByEmail(email);
  if (existing) { chk('e-email',false,'This email already has an application.'); return; }
  const member = { email, name:first+' '+last, year, major, returning, areas, langs:[...document.querySelectorAll('.lang-check:checked')].map(c=>c.value), wetlab, hardware, software, referral: document.getElementById('f-referral').value, semester: CONFIG.semester, status:'pending', tasks:{}, submittedAt:Date.now() };
  try {
    await addDoc(collection(db,'members'), member);
    localStorage.setItem('damp_email', email); sessionEmail = email;
    document.getElementById('form-card').innerHTML = `<div class="success-state"><div class="success-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="success-title">${CONFIG.submitted.title}</div><div class="success-sub">Hi ${first}! ${CONFIG.submitted.message}</div></div>`;
  } catch(e) { alert('Something went wrong. Please try again.'); }
};

function renderTasks() {
  const tasks = CONFIG.tasks;
  const done = tasks.filter(t=>myTasks[t.id]).length;
  document.getElementById('progress-fill').style.width = Math.round(done/tasks.length*100)+'%';
  document.getElementById('progress-label').textContent = `${done} / 5 ${CONFIG.onboarding.progressLabel}`;
  document.getElementById('task-list').innerHTML = tasks.map((t,i)=>`
    <div class="task-item ${myTasks[t.id]?'done':''} ${t.locked?'nodot':''}">
      <div class="task-check"><svg width="9" height="7" viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <span class="task-num">0${i+1}</span>
      <span class="task-name">${t.name}</span>
    </div>`).join('');
}

function renderSectionButtons() {
  const map = {'sc-t1':'t1','sc-t2':'t2','sc-t3':'t3','sc-t5':'t5'};
  Object.entries(map).forEach(([elId,taskId])=>{
    const el = document.getElementById(elId); if(!el) return;
    const done = !!myTasks[taskId];
    el.innerHTML = `<button class="section-complete-btn ${done?'done':''}" ${done?'':` onclick="toggleTask('${taskId}')"`}><div class="btn-check">${done?`<svg width="9" height="7" viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`:''}</div>${done?'✓ Marked as read':'Mark as read'}</button>`;
  });
}

window.toggleTask = async function(id) {
  myTasks[id] = !myTasks[id]; renderTasks(); renderSectionButtons();
  if (myRecord) { try { await updateDoc(doc(db,'members',myRecord.id),{tasks:myTasks}); } catch(e){} }
};

// ── PROJECT CARDS ─────────────────────────────────────────────────────────────
async function loadProjectCards() {
  const container = document.getElementById('project-cards-container');
  if (!container) return;
  const email = myRecord?.email || sessionEmail;
  let myInterests = {};
  if (email) {
    try {
      const q = query(collection(db,'projectInterest'), where('email','==',email));
      const snap = await getDocs(q);
      snap.docs.forEach(d => { const data=d.data(); myInterests[data.projectId] = { id:d.id }; });
    // auto-check t4 if they've already expressed interest in anything
    if (Object.keys(myInterests).length > 0 && !myTasks['t4']) {
      myTasks['t4'] = true;
      if (myRecord) { try { await updateDoc(doc(db,'members',myRecord.id),{tasks:myTasks}); } catch(e){} }
      renderTasks();
      renderSectionButtons();
    }
    } catch(e) {}
  }
  container.innerHTML = CONFIG.projects.map(p => {
    const interest = myInterests[p.id];
    let actionHtml = '';
    let warningHtml = '';
    if (!interest) {
      actionHtml = `<button class="project-link-btn join" onclick="openProjectModal('${p.id}')">Express interest</button>`;
    } else {
      actionHtml = `
        <span style="font-size:12px;color:var(--green);font-weight:500;">Interest submitted</span>
        <a class="project-link-btn" href="${p.when2meet}" target="_blank">When2Meet</a>
        <a class="project-link-btn" href="${p.chatLink}" target="_blank">Request chat access</a>`;
      warningHtml = `
        <div class="warn-block" style="margin-top:14px;margin-bottom:0;">
          <p><strong>Action required:</strong> To be considered for this project you must complete the When2Meet and request Google Chat access above. Both are required.</p>
        </div>`;
    }
    return `
      <div class="project-card">
        <div class="project-card-title" style="margin-bottom:10px;">${p.name}</div>
        <div class="project-card-body">${p.tagline}<br><br>${p.description}</div>
        <div class="project-links">${actionHtml}</div>
        ${warningHtml}
      </div>`;
  }).join('');
}

window.openProjectModal = function(projectId) {
  const p = CONFIG.projects.find(p=>p.id===projectId);
  if (!p) return;
  currentModalProject = p;
  document.getElementById('modal-project-name').textContent = p.name + ' — Express Interest';
  document.getElementById('modal-project-desc').textContent = p.tagline;
  document.getElementById('modal-name').value = myRecord?.name || '';
  document.getElementById('modal-email').value = myRecord?.email || sessionEmail || '';
  document.getElementById('modal-why').value = '';
  document.getElementById('modal-e-name').classList.remove('show');
  document.getElementById('modal-e-email').classList.remove('show');
  document.getElementById('modal-e-why').classList.remove('show');
  document.getElementById('project-modal').classList.add('open');
};
window.closeProjectModal = function() { document.getElementById('project-modal').classList.remove('open'); };
document.getElementById('project-modal').addEventListener('click', e => { if(e.target===document.getElementById('project-modal')) closeProjectModal(); });

window.submitProjectInterest = async function() {
  const name = document.getElementById('modal-name').value.trim();
  const email = document.getElementById('modal-email').value.trim();
  let valid = true;
  const chk = (id,cond) => { const el=document.getElementById(id); if(!cond){el.classList.add('show');valid=false;}else el.classList.remove('show'); };
  const why = document.getElementById('modal-why').value.trim();
  chk('modal-e-name', name);
  chk('modal-e-email', email && email.includes('@'));
  chk('modal-e-why', why);
  if (!valid) return;
  try {
    await addDoc(collection(db,'projectInterest'), { name, email, why, projectId: currentModalProject.id, projectName: currentModalProject.name, semester: CONFIG.semester, submittedAt: Date.now() });
    // auto-check t4
    if (!myTasks['t4']) {
      myTasks['t4'] = true;
      if (myRecord) { try { await updateDoc(doc(db,'members',myRecord.id),{tasks:myTasks}); } catch(e){} }
      renderTasks();
      renderSectionButtons();
    }
    closeProjectModal();
    loadProjectCards();
  } catch(e) { alert('Something went wrong. Please try again.'); }
};

          <li><a onclick="switchTab('interests')" id="nav-interests">Project interests</a></li>
        </ul>
        <div class="sidebar-section">Account</div>
        <ul class="sidebar-nav"><li><a onclick="leadLogout()">Sign out</a></li></ul>
      </aside>
      <main class="main">
        <div class="page-title">${C.dashboardTitle}</div>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;">
          <div class="page-sub" id="lead-sub" style="margin-bottom:0;">Loading...</div>
          <div style="display:flex;align-items:center;gap:8px;margin-left:auto;">
            <label style="font-size:12px;color:var(--text-muted);font-weight:500;">Semester:</label>
            <select class="form-select" id="semester-filter" style="width:160px;padding:6px 10px;font-size:13px;" onchange="renderLeadPanel()">
              <option value="all">All semesters</option>
              <option value="${CONFIG.semester}" selected>${CONFIG.semester}</option>
            </select>
          </div>
        </div>
        <div id="lead-panel"><div class="loading">Loading...</div></div>
      </main>
    </div>`;
  subscribeMembers();
}

function subscribeMembers() {
  onSnapshot(collection(db,'members'), snap => {
    allMembers = snap.docs.map(d=>({id:d.id,...d.data()}));
    // populate semester filter with all known semesters
    const semesters = [...new Set(allMembers.map(m=>m.semester).filter(Boolean))].sort().reverse();
    const filter = document.getElementById('semester-filter');
    if (filter) {
      const current = filter.value;
      filter.innerHTML = `<option value="all">All semesters</option>` +
        semesters.map(s=>`<option value="${s}" ${s===current?'selected':''}>${s}</option>`).join('') +
        (semesters.includes(CONFIG.semester)?'':` <option value="${CONFIG.semester}" ${CONFIG.semester===current?'selected':''}>${CONFIG.semester}</option>`);
    }
    const filtered = getFilteredMembers();
    const pending = filtered.filter(m=>m.status==='pending').length;
    const approved = filtered.filter(m=>m.status==='approved');
    const onboarded = approved.filter(m=>Object.values(m.tasks||{}).filter(Boolean).length===CONFIG.tasks.length).length;
    const sub = document.getElementById('lead-sub');
    if (sub) sub.textContent = `${pending} pending · ${approved.length} approved · ${onboarded} fully onboarded`;
    renderLeadPanel();
  });
}

function getFilteredMembers() {
  const filter = document.getElementById('semester-filter')?.value || 'all';
  if (filter === 'all') return allMembers;
  return allMembers.filter(m => m.semester === filter);
}

window.switchTab = function(tab) {
  leadTab = tab;
  ['pending','approved','interests'].forEach(t => {
    const el = document.getElementById('nav-'+t);
    if (el) el.classList.toggle('active', t===tab);
  });
  renderLeadPanel();
};

function renderLeadPanel() {
  const panel = document.getElementById('lead-panel'); if (!panel) return;
  if (leadTab==='pending') renderPendingTable(panel);
  else if (leadTab==='approved') renderApprovedTable(panel);
  else renderInterestsTable(panel);
}

window.toggleRow = function(rowId) {
  const row = document.getElementById(rowId);
  const btn = row?.previousElementSibling?.querySelector('.expand-btn');
  if (!row) return;
  const isOpen = row.classList.toggle('open');
  if (btn) btn.textContent = isOpen ? '▼' : '▶';
};


window.copyEmails = function(key) {
  const emails = emailStore[key] || [];
  if (!emails.length) { showCopyToast('No emails to copy'); return; }
  const text = emails.join(', ');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      showCopyToast(`Copied ${emails.length} email${emails.length!==1?'s':''}`);
    }).catch(() => fallbackCopy(text, emails.length));
  } else {
    fallbackCopy(text, emails.length);
  }
};

function fallbackCopy(text, count) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    document.execCommand('copy');
    showCopyToast(`Copied ${count} email${count!==1?'s':''}`);
  } catch(e) {
    prompt('Copy these emails:', text);
  }
  document.body.removeChild(ta);
}

function showCopyToast(msg) {
  let toast = document.getElementById('copy-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'copy-toast';
    toast.style.cssText = 'position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1a1d23;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:500;z-index:9999;transition:opacity 0.3s;';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { toast.style.opacity = '0'; }, 2000);
}

window.deleteInterest = async function(id, projectId) {
  if (!confirm('Remove this person from the project? This cannot be undone.')) return;
  try {
    await deleteDoc(doc(db,'projectInterest',id));
    renderInterestsTable(document.getElementById('lead-panel'));
  } catch(e) { alert('Error removing.'); }
};

window.approveMember = async function(id,email,name) {
  try {
    await updateDoc(doc(db,'members',id),{status:'approved',tasks:{}});
    await emailjs.send(EMAILJS.serviceId,EMAILJS.templateId,{to_name:name,to_email:email,link:CONFIG.onboardingUrl});
  } catch(e) { console.error(e); alert('Approved in database but email may have failed.'); }
};
window.rejectMember = async function(id) {
  if (!confirm('Remove this person? This cannot be undone.')) return;
  try { await deleteDoc(doc(db,'members',id)); } catch(e) { alert('Error.'); }
};
window.assignProject = async function(id) {
  const val = document.getElementById('proj-'+id)?.value.trim();
  try { await updateDoc(doc(db,'members',id),{project:val}); } catch(e) {}
};
window.leadLogout = function() { localStorage.removeItem('damp_role'); location.reload(); };
window.exportCSV = function() {
  const list = allMembers.filter(m=>m.status==='approved');
  const rows=[['Name','Email','Year','Semester','Tasks Done','Status']];
  list.forEach(m=>{ const done=Object.values(m.tasks||{}).filter(Boolean).length; rows.push([m.name,m.email||'',m.year||'',m.semester||'',`${done}/${CONFIG.tasks.length}`,done===CONFIG.tasks.length?'Complete':done===0?'Not started':'In progress']); });
  const csv=rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
  const a=document.createElement('a'); a.href='data:text/csv,'+encodeURIComponent(csv); a.download=`damp_cohort_${CONFIG.semester.replace(' ','_')}.csv`; a.click();
};
